services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-it_asset_db}
      MYSQL_USER: ${MYSQL_USER:-it_asset_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-it_asset_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-it_asset_root_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - it_asset_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-it_asset_db}
      DB_USER: ${MYSQL_USER:-it_asset_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-it_asset_password}
      DEFAULT_LOGIN_PASSWORD: ${DEFAULT_LOGIN_PASSWORD:-admin123}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      INITIAL_COMPANY_CODE: ${INITIAL_COMPANY_CODE:-COMPANY}
      INITIAL_COMPANY_NAME: ${INITIAL_COMPANY_NAME:-Company}
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - it_asset_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  it_asset_node_modules:
  it_asset_mysql:
